<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Mortgage Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><div class="calculator-card">
    <h2>Mortgage Calculator</h2>
    <div class="calculator-card">
        <h2>Mortgage Calculator</h2>
        <label>Home Price ($): <input type="number" id="price" value="300000"></label>
        <label>Down Payment ($): <input type="number" id="down" value="60000"></label>
        <label>Interest Rate (%): <input type="number" id="rate" value="6.5" step="0.1"></label>
        <label>Loan Term (Years): <input type="number" id="term" value="30"></label>
        <button onclick="calculateMortgage()">Calculate Payment</button>
        <button onclick="clearFields()" class="reset-btn">Reset Inputs</button
        <h3 id="result">Monthly Payment: $0.00</h3>
    </div>
    <script src="script.js"></script>
</body>
</html>
<script src="script.js"></script>
